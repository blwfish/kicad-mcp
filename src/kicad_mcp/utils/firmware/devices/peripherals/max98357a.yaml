roles: {DIN: DIN, BCLK: BCLK, LRCLK: LRCLK, SD_MODE: "~{SD_MODE}", OUTP: OUTP, OUTN: OUTN}
supply_pins: ["7", "8"]
ground_pins: ["3", "11", "15", "17"]   # GND pins + EP pad 17
module: false
