name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad symbol libraries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kicad-symbols

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps (from lockfile)
        run: uv sync --frozen --group dev

      - name: Run tests
        env:
          KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
        run: uv run python -m pytest tests/ -q

  # Gate the release on the SAME self-hosted KiCad integration matrix that runs
  # on main (integration-matrix.yml), so a tag can never cut a release with the
  # board pipeline red (the gap that let v0.11.0 publish over a red integration
  # run). kicad-10.0 is the hard gate; kicad-9.0 is advisory (continue-on-error)
  # -- its FreeRouter is chronically marginal. One shared definition means the
  # machine-wide flock and max-parallel apply here too.
  integration:
    uses: ./.github/workflows/integration-matrix.yml

  release:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('-'),
            });
