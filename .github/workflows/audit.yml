name: Dependency Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run audit
        id: audit
        run: |
          if uv run pip-audit --desc; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-fix vulnerable packages
        if: steps.audit.outputs.clean == 'false'
        run: |
          uv run pip-audit --format=json -o /tmp/audit.json || true
          python3 - <<'EOF'
          import json, subprocess, sys
          data = json.load(open("/tmp/audit.json"))
          pkgs = [dep["name"] for dep in data.get("dependencies", []) if dep.get("vulns")]
          print("Vulnerable packages to upgrade:", pkgs, flush=True)
          for pkg in pkgs:
              subprocess.run(["uv", "lock", "--upgrade-package", pkg], check=True)
          EOF

      # A PR opened by this job's GITHUB_TOKEN does NOT trigger pull_request-
      # based CI: GitHub deliberately excludes GITHUB_TOKEN-authored events
      # from cascading into further workflow runs (anti-recursion), so
      # tests.yml/integration.yml never fire on a dep-audit PR no matter how
      # long it sits open. Run the real test suite here instead, so a human
      # reviewer gets a genuine pass/fail signal rather than an eternally
      # checkless PR. (2026-07-25: 5 weeks of these piled up unmerged for
      # exactly this reason before anyone noticed — see PR #109.)
      - name: Run test suite against the bumped lockfile
        if: steps.audit.outputs.clean == 'false'
        run: uv run pytest -q --timeout=120

      - name: Open or update PR with fixed lock file
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet uv.lock; then
            echo "::error::Vulnerabilities found but uv lock upgrade produced no changes — manual fix required"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A stable (undated) branch name, so an unmerged week's fix gets
          # UPDATED in place next week instead of stacking a new PR on top of
          # it — stacking dated branches (dep-audit/fix-YYYYMMDD) is exactly
          # what let 5 separate PRs pile up unreviewed for a month.
          BRANCH="dep-audit/fix"
          git checkout -B "$BRANCH"
          git add uv.lock
          git commit -m "fix(deps): bump vulnerable packages from dep audit ($(date +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          BODY="$(python3 - <<PYEOF
          import json
          data = json.load(open("/tmp/audit.json"))
          lines = [
              "Automated fix from weekly dependency audit ($(date +%Y-%m-%d)).",
              "",
              "This PR does not get pull_request-triggered CI (GITHUB_TOKEN-authored",
              "PRs are excluded from triggering further workflow runs) -- the test",
              "suite was run inline in this job instead; see the workflow run logs.",
              "",
          ]
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  fixes = ", ".join(v.get("fix_versions", ["none"]))
                  lines.append(f"- **{dep['name']}** {dep['version']}: {v['id']} -> fix in {fixes}")
          print("\n".join(lines))
          PYEOF
          )"

          existing=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
            --base main --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updating existing PR #$existing"
            gh pr edit "$existing" --body "$BODY"
          else
            gh pr create \
              --title "fix(deps): bump vulnerable packages ($(date +%Y-%m-%d))" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi
