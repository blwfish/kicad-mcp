name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad symbol libraries
        # 13 tests load symbols (Device:R, etc.) via kicad-sch-api, which
        # looks up symbol files at /usr/share/kicad/symbols. Without these
        # the tests fail with "Symbol 'Device:R' not found in KiCAD
        # libraries". Locally the user has full KiCad installed; CI
        # only needs the symbol library package.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kicad-symbols

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + test deps
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-asyncio

      - name: Run tests
        env:
          KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
        run: python -m pytest tests/ -q
