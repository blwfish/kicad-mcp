name: Integration Tests (KiCad multi-version)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: integration / kicad-${{ matrix.kicad }}
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        include:
          - kicad: "10.0"
            continue_on_error: false
          - kicad: "9.0"
            continue_on_error: true
    continue-on-error: ${{ matrix.continue_on_error }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify KiCad install
        run: |
          kicad_app="/Volumes/Files/claude/kicad-versions/${{ matrix.kicad }}/KiCad.app"
          if [ ! -d "$kicad_app" ]; then
            echo "KiCad ${{ matrix.kicad }} not found at $kicad_app"
            echo "See docs/MULTI_VERSION_TESTING.md for install instructions."
            exit 1
          fi
          echo "KICAD_APP_PATH=$kicad_app" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync

      - name: Run integration tests
        run: |
          KICAD_INTEGRATION=1 uv run pytest tests/integration/ -v \
            --tb=short \
            --timeout=120
