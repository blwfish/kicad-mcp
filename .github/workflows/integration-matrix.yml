name: Integration matrix (reusable)

# The ONE definition of the self-hosted KiCad integration matrix. Called by
# integration.yml (PR / push / merge queue / schedule) and release.yml (tag
# gate). Keep every matrix, serialization and timeout decision HERE: when the
# two callers each carried a copy, a fix applied to one (the machine-wide flock,
# max-parallel) silently missed the other and a release ran its KiCad legs
# unserialized (v0.18.2).
#
# Check names: the callers name their job `integration`, and GitHub renders a
# reusable-workflow job as "<caller job> / <called job>", so these legs surface
# as "integration / kicad-10.0". (A kicad-9.0 leg existed until 2026-11-11 and was
# dropped: upstream ended 9.x with 9.0.9 -- the last bug-fix release -- when 10.0
# shipped in March 2026, and firmware-generated schematics don't load in 9.0.9.)
#
# Do NOT add a `concurrency:` block here: a called workflow that declares the
# same group as its caller cancels/deadlocks against it. Concurrency belongs to
# the callers.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kicad:
    name: kicad-${{ matrix.kicad }}
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      # Multiple self-hosted runners are registered under the "macOS" label but
      # share one physical machine, so when this matrix had two legs (kicad-9.0
      # and kicad-10.0) they could be picked up concurrently -- each launching
      # its own batch of FreeRouter JVMs during autoroute tests. Investigated 2026-09-24 (PR #148): a CI-only
      # "hang" in test_expander_terminals_to_routed_pcb was actually every pass
      # completing successfully but ~10x slower than normal (loadavg 32-33),
      # consistent with both legs' FreeRouter batches colliding at the same
      # relative test-execution moment. max-parallel: 1 forces legs to run one
      # at a time so they never compete for the machine's CPU/JVMs; it is kept
      # (and the matrix kept as a list) so a future second KiCad version stays
      # serialized rather than reintroducing that collision.
      max-parallel: 1
      matrix:
        include:
          - kicad: "10.0"
            continue_on_error: false
    continue-on-error: ${{ matrix.continue_on_error }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify KiCad install
        run: |
          kicad_app="/Volumes/Files/claude/kicad-versions/${{ matrix.kicad }}/KiCad.app"
          if [ ! -d "$kicad_app" ]; then
            echo "KiCad ${{ matrix.kicad }} not found at $kicad_app"
            echo "See docs/MULTI_VERSION_TESTING.md for install instructions."
            exit 1
          fi
          echo "KICAD_APP_PATH=$kicad_app" >> "$GITHUB_ENV"
          # Pin the CLI to this leg's KiCad. kicad-cli detection checks
          # KICAD_CLI_PATH, then PATH, then KICAD_APP_PATH -- and the runner's
          # PATH has /opt/homebrew/bin first, whose kicad-cli symlinks to the
          # Homebrew-installed KiCad (a different version than the pinned
          # one). Without this, every matrix leg silently tested that one copy.
          kicad_cli="$kicad_app/Contents/MacOS/kicad-cli"
          if [ ! -x "$kicad_cli" ]; then
            echo "kicad-cli not executable at $kicad_cli"
            exit 1
          fi
          echo "KICAD_CLI_PATH=$kicad_cli" >> "$GITHUB_ENV"
          "$kicad_cli" --version

      - name: Install Python dependencies
        run: uv sync

      - name: Run integration tests
        # Isolate KiCad's config/cache per runner so concurrent kicad-cli runs
        # (multiple self-hosted runners on one machine) can't race on shared
        # config init or lock files. runner.temp is unique per runner and wiped
        # per job. Verified: KiCad 10 honors KICAD_CONFIG_HOME (writes
        # kicad_common.json there, ignores $HOME).
        env:
          KICAD_CONFIG_HOME: ${{ runner.temp }}/kicad-config
        #
        # KNOWN UNEXPLAINED FLAKE -- "KiCad CLI not found" / "netlist export failed".
        # Seen 2026-06 (first few tests, self-recovered; see commit 37f53bc's
        # retry) and 2026-11-09 (PR #193: all 26 CLI-dependent tests failed for
        # the whole ~18 min run, which looks like kicad-cli --version hanging:
        # 3 probes x 10 s timeout per call). Root cause NOT established. The
        # PATH-resolves-to-Homebrew bug fixed above is a real discrepancy but is
        # not shown to be the cause; the machine's macOS was also updated that
        # afternoon, so green runs since are not evidence it is fixed.
        # If you see it again, the log now says WHY: grep the job log for
        # "validation failed:" -- it records "--version timed out after Ns (process
        # hung)", "--version exited N: <stderr>", or "--version could not run: <err>".
        # Capture that line (and anything else running on the runner machine) in
        # a new issue instead of re-running blind.
        #
        # Held under a machine-wide flock so *different runs* (two PRs, or a PR
        # plus a push to main) also never overlap on the shared machine --
        # max-parallel above only serializes legs within one run, and Actions
        # `concurrency:` can't serialize across runs without cancelling queued
        # jobs. Observed 2026-10-05: PR #163's autoroute tests timed out/failed
        # while PR #161's run overlapped it on the same legs. See
        # scripts/ci_machine_lock.py.
        run: |
          KICAD_INTEGRATION=1 uv run python scripts/ci_machine_lock.py -- \
            uv run pytest tests/integration/ -v \
            --tb=short \
            --timeout=120
