name: Check Upstream Releases

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load current-version baseline
        id: baseline
        run: cat .github/upstream-versions.env >> "$GITHUB_ENV"

      - name: Check FreeRouter releases
        id: freerouter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/freerouting/freerouting/releases/latest --jq '.tag_name' | sed 's/^v//')
          CURRENT="$FREEROUTER_VERSION"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Check KiCad releases
        id: kicad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/KiCad/KiCad/releases/latest --jq '.tag_name' | sed 's/^v//')
          CURRENT="$KICAD_VERSION"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Python dependencies
        id: python_deps
        run: |
          python3 -m venv /tmp/dep-check
          /tmp/dep-check/bin/pip install -e . -q
          OUTDATED=$(/tmp/dep-check/bin/pip list --outdated --format=json | jq -r '.[] | "\(.name)==\(.latest_version)"' 2>/dev/null || echo "")
          if [ -n "$OUTDATED" ]; then
            echo "outdated<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTDATED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "update_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if updates available
        if: |
          steps.freerouter.outputs.update_available == 'true' ||
          steps.kicad.outputs.update_available == 'true' ||
          steps.python_deps.outputs.update_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const freerouter_current = '${{ steps.freerouter.outputs.current }}';
            const freerouter_latest = '${{ steps.freerouter.outputs.latest }}';
            const kicad_current = '${{ steps.kicad.outputs.current }}';
            const kicad_latest = '${{ steps.kicad.outputs.latest }}';
            const python_deps = `${{ steps.python_deps.outputs.outdated }}`;

            let body = '# Upstream Dependency Updates Available\n\n';

            if ('${{ steps.freerouter.outputs.update_available }}' === 'true') {
              body += `## FreeRouter\n- Current: v${freerouter_current}\n- Latest: v${freerouter_latest}\n- Download: https://github.com/freerouting/freerouting/releases/tag/v${freerouter_latest}\n\n`;
            }

            if ('${{ steps.kicad.outputs.update_available }}' === 'true') {
              body += `## KiCad\n- Current: v${kicad_current}\n- Latest: v${kicad_latest}\n- Download: https://www.kicad.org/download/\n\n`;
            }

            if (python_deps.trim()) {
              body += `## Python Dependencies\n\`\`\`\n${python_deps}\n\`\`\`\n\n`;
            }

            body += '**Note:** Review and test before upgrading. Some updates may require configuration changes.';

            // Check if an issue already exists from this week
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              sort: 'created',
              direction: 'desc'
            });

            const recentIssue = issues.data.find(issue =>
              issue.title.includes('Upstream Dependency Updates') &&
              new Date(issue.created_at) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
            );

            if (!recentIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream Dependency Updates Available',
                body: body,
                labels: ['dependencies']
              });
            }
