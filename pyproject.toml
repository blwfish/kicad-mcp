[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-mcp"
version = "0.11.0"
description = "MCP server for KiCad electronic design automation — schematic, PCB layout, and analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Brian Wong" },
]
keywords = ["kicad", "eda", "electronics", "pcb", "schematic", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.4",
    "authlib>=1.7.1",
    "kicad-sch-api>=0.5.6",
    "pyyaml>=6.0.3",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.32",
    "mcp-events>=0.1.0",
    "networkx>=3.0",
]

[project.scripts]
kicad-mcp = "kicad_mcp.server:main"

[project.urls]
Homepage = "https://github.com/blwfish/kicad-mcp"
"Bug Tracker" = "https://github.com/blwfish/kicad-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.161.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["kicad_mcp"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
testpaths = ["tests"]
norecursedirs = ["tests/integration", ".hypothesis"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require KiCad)",
    "requires_kicad: Tests that require KiCad Python 3.9 with pcbnew bindings",
]

# pytest-cov was already a declared dev dependency but never configured or
# invoked. Coverage is a floor-check, not a quality gate — deliberately not
# wired into the default pytest run above; invoke explicitly at release-gate
# cadence: `.venv/bin/pytest --cov --cov-report=term-missing -m "not integration"`.
# /full-review's Phase 3.5 detects this config and runs it the same way.
[tool.coverage.run]
source = ["src/kicad_mcp"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
skip_empty = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pcbnew", "kicad_sch_api.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "defusedxml.*", "sexpdata", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mcp-events 0.1.0 doesn't ship a py.typed marker yet. Remove this override
# when the upstream package adds typing markers.
module = ["mcp_events"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# networkx 3.x ships no typing markers as of Aug 2024; types-networkx exists
# but the stub coverage is partial. Treat as untyped for now.
module = ["networkx", "networkx.*"]
ignore_missing_imports = true
